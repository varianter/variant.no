name: Update Changelog

on:
  schedule:
    # Runs every Friday at 2:00 PM UTC
    - cron: "0 14 * * 5"
  workflow_dispatch: # allows manual trigger

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run changelog script
        run: npm run changelog

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/update-changelog-$(date +'%Y-%m-%d')"
          git checkout -b "$branch"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update changelog [skip ci]"
          git push origin "$branch"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update changelog [skip ci]"
          branch: ${{ steps.commit.outputs.branch }}
          title: "chore: update changelog"
          body: "Automated changelog update for this week 🚀"
          labels: "automation, changelog"
          base: v3
